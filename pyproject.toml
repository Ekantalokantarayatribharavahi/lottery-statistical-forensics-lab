[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="lottery-statistical-forensics-lab"
version="0.1.0"
description="Reproducible statistical forensics for lottery draw histories."
readme="README.md"
requires-python=">=3.10"
dependencies=["numpy>=1.26,<3","scipy>=1.12,<2","pandas>=2.1,<3","statsmodels>=0.14,<1"]

[project.optional-dependencies]
dev=["pytest>=8,<9"]

[project.scripts]
forensic="lottery_statistical_forensics.cli:main"

[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["src"]

[tool.setuptools.packages.find]
where=["src"]
